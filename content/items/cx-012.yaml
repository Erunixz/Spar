prompt: |
  What is the time complexity for n piles, where M is the largest pile?

  ```python
  def min_speed(piles, hours):
      lo, hi = 1, max(piles)
      while lo < hi:
          mid = (lo + hi) // 2
          needed = sum((p + mid - 1) // mid for p in piles)
          if needed <= hours:
              hi = mid
          else:
              lo = mid + 1
      return lo
  ```
choices: ["O(n)", "O(log M)", "O(n log M)", "O(n * M)"]
answer: "O(n log M)"
explanation: |
  The search over speeds takes O(log M) rounds, and each round sums over all
  n piles.
