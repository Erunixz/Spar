prompt: |
  Flights between cities each have a price. Find the cheapest total price to
  get from one city to another.
choices: [graphs, greedy, binary-search, sliding-window]
answer: graphs
signals: [weighted connections, cheapest route]
explanation: |
  A shortest-path problem on a weighted graph: Dijkstra's algorithm with a
  priority queue, O(E log V) for non-negative prices.
