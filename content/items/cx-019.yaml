id: cx-019
type: complexity
difficulty: easy
est_seconds: 30
pattern_ids: [linked-list]
prompt: |
  What is the time complexity for a linked list of n nodes?

  ```python
  def reverse(head):
      prev = None
      while head:
          nxt = head.next
          head.next = prev
          prev = head
          head = nxt
      return prev
  ```
choices: ["O(1)", "O(log n)", "O(n)", "O(n^2)"]
answer: "O(n)"
explanation: |
  Each node is visited once and rewired with O(1) work.
