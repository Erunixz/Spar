pattern_ids: [two-pointers]
prompt: |
  What is the time complexity for a list of n numbers?

  ```python
  def three_sum(nums):
      nums.sort()
      out = []
      for i in range(len(nums)):
          if i and nums[i] == nums[i - 1]:
              continue
          lo, hi = i + 1, len(nums) - 1
          while lo < hi:
              s = nums[i] + nums[lo] + nums[hi]
              if s < 0:
                  lo += 1
              elif s > 0:
                  hi -= 1
              else:
                  out.append((nums[i], nums[lo], nums[hi]))
                  lo += 1
                  while lo < hi and nums[lo] == nums[lo - 1]:
                      lo += 1
      return out
  ```
choices: ["O(n log n)", "O(n^2)", "O(n^2 log n)", "O(n^3)"]
answer: "O(n^2)"
explanation: |
  Sorting is O(n log n); then for each i the two pointers cross the rest of
  the list once, O(n) per i, so O(n^2) overall.
