pattern_ids: [intervals]
prompt: |
  What is the time complexity for n intervals?

  ```python
  def merge(intervals):
      intervals.sort(key=lambda iv: iv[0])
      merged = []
      for start, end in intervals:
          if merged and start <= merged[-1][1]:
              merged[-1][1] = max(merged[-1][1], end)
          else:
              merged.append([start, end])
      return merged
  ```
choices: ["O(n)", "O(n log n)", "O(n^2)", "O(n^2 log n)"]
answer: "O(n log n)"
explanation: |
  Sort once, then one linear pass that only looks at the last merged block.
